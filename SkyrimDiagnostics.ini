# SkyrimDiagnostics configuration.
#
# This one file has all settings of the tool, in three parts:
#   [[Settings]]     switches and values
#   [[Layout]]       what the overlay shows, and in which order
#   [[Suggestions]]  the mod suggestions that the session report shows
#
# The tool reads this file when the game starts. The suggestions are also
# read again each time the session report is written (one time each minute).
# The game location of this file is Data/SKSE/Plugins/SkyrimDiagnostics.ini.
# If the file is not there, the tool makes it with this text.
#
# A line that starts with # is a comment. In the Settings and Layout parts,
# text after # on a line is ignored too.

[[Settings]]

[Overlay]
# View when the game starts: all, warnings, off.
# F10 (or the key below) changes the view while the game runs: all data,
# warnings only, off. When the view changes to off, a text shows for
# 10 seconds.
View = all

# Key that changes the view. Windows virtual key code. 0x79 = F10.
ToggleKey = 0x79

# Seconds that a warning stays on the screen after its condition ended.
WarningHoldSeconds = 30

# AbyssusLib draws the overlay (a separate mod, required for the overlay).

[Warnings]
# The frame rate warning shows below this value.
FpsBelow = 57

[Samplers]
# 1 = on, 0 = off.
# Profiler: samples the busy threads to find where the processor time goes.
Profiler = 1
# Papyrus: reads the list of script stacks.
Papyrus = 1
# PapyrusTime: measures the time that the script engine uses in each script
# function. For this, the tool changes one entry in the function table of
# the script function class. Papyrus must be 1.
PapyrusTime = 1
# EngineLimits: counts the object references in use and the plugins. If the
# game shows an "address library" error after an update of the game or of
# this tool, set this value to 0.
EngineLimits = 1
# Animations: counts the loaded animation files. If the game shows an
# "address library" error, set this value to 0.
Animations = 1
# MemoryByDll: counts the heap memory that each mod DLL allocates. For this,
# the tool changes the import tables of the mod DLLs in memory. Set this
# value to 0 if a mod does not operate correctly with it.
MemoryByDll = 1

[Stall]
# Seconds with no response from the game update before a stall report.
StallSeconds = 30


[[Layout]]

# One line for each part of the overlay, in the order of display.
# - Move a line to move the part.
# - A line in brackets, for example [Limits], starts a section. The overlay
#   draws a line between sections. The name is free text.
# - Write "off" after a part to hide it:               graph off
# - Write "off" after a section to hide all of it:     [Papyrus] off
#
# Parts:
#   fps         FPS, frame time, 1% low, worst frame
#   graph       frame time graph
#   present     wait in Present, GPU queue
#   limit       what limits the frame rate
#   drawcalls   draw calls in each frame
#   latency     input latency
#   response    response time of the game update thread
#   memory      game memory
#   vram        video memory
#   references  object references
#   plugins     plugin counts
#   animations  loaded animation files
#   modmemory   heap memory of the mod DLLs with the most memory
#   threads     busy threads and where they work
#   moddlls     processor use of mod DLLs
#   papyrus     Papyrus stack counts
#   scripts     Papyrus scripts with the most stacks
#   functions   Papyrus functions with the most time

[Frames]
fps
limit
graph
present
latency
drawcalls

[Limits]
plugins
memory
vram
references
animations
response
modmemory

[Processor]
threads

[Mod DLL's]
moddlls

[Papyrus]
papyrus
scripts
functions


[[Suggestions]]

# The session report (HTML) shows the lines of a section when that problem
# type occurred in the session. One line is one suggestion. You can add,
# remove or change lines and sections.
#
# The start list has mods that are well known for each problem type. The
# tool did not check them against your game version or your mod list. Read
# the page of a mod before you install it.

[fps-cpu]
Look at the 'Mod DLLs' and 'Threads' tables in the report first: they name what uses the processor.
SSE Engine Fixes - engine fixes and a faster memory manager
eFPS - Exterior FPS boost - occlusion planes that lower the draw calls outside
Insignificant Object Remover - removes small objects, fewer draw calls

[fps-gpu]
Lower the resolution, the shadow resolution, or the effects of ENB or Community Shaders.
Community Shaders with upscaling (DLSS, FSR, XeSS) - renders at a lower resolution

[fps-cap]
SSE Display Tweaks - sets the frame cap; look at FramerateLimit in its settings

[stutter]
SSE Engine Fixes - memory manager and save fixes
SSE Display Tweaks - frame pacing
Look at the 'Slow frames' table in the report: it names the module and the place of each slow frame.

[latency]
SSE Display Tweaks - lower the number of frames that the GPU has in its queue
A higher frame rate lowers the latency: see the fps sections.

[memory-low]
Close other programs. Use smaller texture versions (1K or 2K) of large texture mods.

[memory-full]
Close other programs. Use smaller texture versions (1K or 2K) of large texture mods.

[memory-growth]
Look at the 'Heap memory by mod DLL' table and at the mods that you added last.

[vram-high]
VRAMr - makes smaller versions of the textures of your mod list
Cathedral Assets Optimizer - compresses and resizes textures

[vram-full]
VRAMr - makes smaller versions of the textures of your mod list
Cathedral Assets Optimizer - compresses and resizes textures

[papyrus-stacks]
Look at the 'Papyrus scripts' and 'Papyrus function time' tables in the report: they name the scripts with the most work.
Papyrus Tweaks NG - script engine fixes and settings

[references]
Mods that add many objects to the world use the object references. Remove or replace the largest of them.

[plugins]
Change plugins to light plugins (ESL flag) where the plugin permits it, or merge small plugins.

[stall]
Read the PROBABLE CAUSE section of the stall report in the Reports folder.
